# INACTIVE example. Copy to .github/workflows/release.yml only once a repository and signing secrets exist.
# See docs/DISTRIBUTION.md. Never run this against an unsigned build and call it a public release.
name: Release
on:
  push:
    tags: ['v*']
jobs:
  mac:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: npm run dist:check
      - run: npm run dist:smoke
      - run: npm run release:manifest
      - uses: softprops/action-gh-release@v2
        with:
          draft: true # a person reads it and publishes it
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
