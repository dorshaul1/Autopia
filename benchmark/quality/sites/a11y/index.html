<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Newsletter</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 480px; padding: 16px; color: #222; background: #fff; }
      .icon { width: 32px; height: 32px; border: 0; background: #1a56db; color: #fff; }
      .muted { color: #b5b5b5; }
    </style>
  </head>
  <body>
    <h1>Join the newsletter</h1>
    <p class="muted">One email a month, no spam.</p>
    <img src="logo.svg" width="40" height="40" />
    <form>
      <input type="email" name="email" placeholder="you@example.com" />
      <button class="icon" type="submit"><svg width="16" height="16" aria-hidden="true"><path d="M2 8h12" stroke="#fff"/></svg></button>
    </form>
  </body>
</html>
