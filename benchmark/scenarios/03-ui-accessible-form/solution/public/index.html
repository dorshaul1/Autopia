<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Create your account</h1>
      <p class="hint">It only takes a minute.</p>
      <form id="signup" novalidate>
        <label for="displayName">Your name</label>
        <input id="displayName" name="displayName" type="text" aria-describedby="displayName-error" />
        <p id="displayName-error" class="error" aria-live="polite"></p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" aria-describedby="email-error" />
        <p id="email-error" class="error" aria-live="polite"></p>
        <label for="password">Password (8+ characters)</label>
        <input id="password" name="password" type="password" aria-describedby="password-error" />
        <p id="password-error" class="error" aria-live="polite"></p>
        <button type="submit" class="btn">Sign up</button>
        <p id="status" role="status"></p>
      </form>
      <p class="small">By signing up you agree to our terms.</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
